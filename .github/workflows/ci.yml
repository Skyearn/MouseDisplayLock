name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if [[ "$XCODE_MAJOR" != "27" ]]; then
            echo "::error::Expected Xcode 27 on the xcode-27 runner, found $XCODE_MAJOR"
            exit 1
          fi

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers

      - name: Build
        run: |
          xcodebuild \
            -project MouseDisplayLock.xcodeproj \
            -scheme MouseDisplayLock \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate build product
        id: product
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/MouseDisplayLock-* \
            -path "*/Build/Products/Debug/MouseDisplayLock.app" \
            -type d 2>/dev/null | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseDisplayLock-${{ github.sha }}
          path: ${{ steps.product.outputs.app_path }}
          if-no-files-found: error
          retention-days: 14
