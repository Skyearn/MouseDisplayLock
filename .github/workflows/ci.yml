name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers

      - name: Build
        run: |
          xcodebuild \
            -project MouseDisplayLock.xcodeproj \
            -scheme MouseDisplayLock \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Locate build product
        id: product
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/MouseDisplayLock-* \
            -path "*/Build/Products/Debug/MouseDisplayLock.app" \
            -type d 2>/dev/null | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseDisplayLock-${{ github.sha }}
          path: ${{ steps.product.outputs.app_path }}
          if-no-files-found: error
          retention-days: 14
